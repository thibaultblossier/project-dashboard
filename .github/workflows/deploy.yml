name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Apps Script web-app URL. The repository variable DATA_URL, when set, takes precedence.
          # Not a secret: the URL is visible in the published page and returns only dashboard fields.
          VITE_DATA_URL: ${{ vars.DATA_URL || 'https://script.google.com/macros/s/AKfycbwtYM0ncgUZ7yRctXIkgxGEZIU4PoXVOg2fdR6I5K6R5grpHtkHZeVPU0njhD8LR04yGA/exec' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
